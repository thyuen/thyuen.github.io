{% assign canonical_publication_url = site.url | append: site.baseurl | append: page.url %}

<section class="publication-share" aria-label="Share this publication">
  <span class="publication-share__label">Share:</span>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ canonical_publication_url | uri_escape }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <span aria-hidden="true"> · </span>
  <button class="publication-share__copy" type="button" data-publication-url="{{ canonical_publication_url | escape }}">Copy link</button>
  <span class="publication-share__status" role="status" aria-live="polite"></span>
</section>

<script>
  (function () {
    document.querySelectorAll('.publication-share__copy').forEach(function (button) {
      button.addEventListener('click', function () {
        if (!navigator.clipboard || !window.isSecureContext) return;

        navigator.clipboard.writeText(button.dataset.publicationUrl).then(function () {
          var status = button.parentNode.querySelector('.publication-share__status');
          status.textContent = 'Link copied';
          window.setTimeout(function () { status.textContent = ''; }, 2000);
        }).catch(function () {});
      });
    });
  }());
</script>
