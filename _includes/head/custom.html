{% include base_path %}

<!-- start custom head snippets -->

<!-- Site icon -->
<link rel="icon" type="image/png" sizes="512x512" href="{{ base_path }}/images/site-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/site-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/site-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/site-icon.png">
<link rel="shortcut icon" type="image/png" href="{{ base_path }}/images/site-icon.png">

<meta name="theme-color" content="#06204a">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css">

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->
